<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>viewnc – Separate Plot Window</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <!-- Plotly for interactive plots -->
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <link rel="stylesheet" href="/static/style.css" />
  <style>
    body {
      margin: 0;
      padding: 14px;
      background: var(--bg-base);
      color: var(--text-primary);
      height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: 'Inter', system-ui, sans-serif;
      overflow: hidden;
    }
    
    .plot-window-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      padding: 8px 12px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
    }
    
    .plot-window-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-primary);
    }
    
    .plot-window-actions {
      display: flex;
      gap: 6px;
    }
    
    .plotly-container-popout {
      flex: 1;
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 8px;
      position: relative;
      overflow: hidden;
    }
    
    #plotly-div-popout {
      width: 100%;
      height: 100%;
    }
    
    /* Stats bar */
    .stats-bar-popout {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.72rem;
      color: var(--text-secondary);
    }
  </style>
</head>
<body>

  <div class="plot-window-header">
    <div class="plot-window-title" id="plot-window-title">No plot rendered yet</div>
    <div class="plot-window-actions">
      <button class="btn btn-ghost btn-sm" onclick="exportCSV()" title="Download displayed slice as CSV">⬇ CSV</button>
      <button class="btn btn-ghost btn-sm" onclick="exportNetCDF()" title="Download displayed slice as NetCDF">⬇ NetCDF</button>
      <button class="btn btn-ghost btn-sm" onclick="downloadPlot()">⬇ PNG</button>
    </div>
  </div>

  <div class="plotly-container-popout">
    <div id="plotly-div-popout"></div>
  </div>

  <script>
    // Cached plot configuration to enable export buttons directly from the child window
    let lastPlotTitle = "";
    let lastPlotData = null;
    let lastPlotLayout = null;
    let lastPlotConfig = null;

    // Main update function called by the parent window
    window.updatePlot = function(title, data, layout, config) {
      lastPlotTitle = title;
      lastPlotData = data;
      lastPlotLayout = layout;
      lastPlotConfig = config;

      document.getElementById('plot-window-title').textContent = title;
      
      // Plotly plot height auto-adjustment inside the flexbox container
      Plotly.newPlot('plotly-div-popout', data, layout, config);
    };

    // Forward the export actions back to the parent window
    function exportCSV() {
      if (window.opener && !window.opener.closed) {
        window.opener.exportCSV();
      }
    }

    function exportNetCDF() {
      if (window.opener && !window.opener.closed) {
        window.opener.exportNetCDF();
      }
    }

    function downloadPlot() {
      // Save directly from the child window Plotly instance
      if (lastPlotData) {
        Plotly.downloadImage('plotly-div-popout', {
          format: 'png',
          width: lastPlotLayout.width || 1200,
          height: lastPlotLayout.height || 800,
          filename: 'viewnc_plot'
        });
      }
    }

    // Auto-resize Plotly when child window size changes
    window.onresize = function() {
      if (lastPlotData) {
        Plotly.Plots.resize('plotly-div-popout');
      }
    };

    // Notify the parent window that we are ready
    if (window.opener && !window.opener.closed) {
      window.opener.onPlotWindowLoaded(window);
    }
  </script>
</body>
</html>
